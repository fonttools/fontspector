[package]
name = "fontspector-profile-silfonts"
version = "1.0.0"
edition = "2021"
description = "Fontspector checks for SIL Fonts font conformance"
repository = "https://github.com/fonttools/fontspector"
homepage = "https://fonttools.github.io/fontspector/"
license = "Apache-2.0"

[lib]
name = "fontspector_profile_silfonts"

[dependencies]
fontspector-checkapi = { path = "../fontspector-checkapi", features = [
    "kurbo",
], version = "1.0.0" }
regex = { workspace = true }
skrifa = { workspace = true }
[features]
sourcefix = ["fontspector-checkapi/sourcefix"]

[lints]
workspace = true
