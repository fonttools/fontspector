[package]
name = "fontspector"
version = "1.9.1"
authors = ["Simon Cozens <simon@simon-cozens.org>"]
edition = "2021"
description = "Quality control for OpenType fonts"
repository = "https://github.com/fonttools/fontspector"
homepage = "https://fonttools.github.io/fontspector/"
license = "Apache-2.0"
readme = "../README.md"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/fontspector-v{ version }/{ name }-v{ version }-{target}{ archive-suffix }"

[features]
fontc = ["dep:fontc", "dep:glyphs2fontir", "dep:fontir"]

[build-dependencies]
walkdir = "2.5"
zip = { workspace = true }
quote = "1.0"
shadow-rs = "2.0.0"

[dependencies]
fontspector-checkapi = { path = "../fontspector-checkapi", version = "1.0.0", features = [
    "clap",
    "sourcefix",
] }
# These profiles are baked-in
profile-universal = { path = "../profile-universal", version = "1.0.0", package = "fontspector-profile-universal", features = [
    "sourcefix",
] }
profile-fontwerk = { path = "../profile-fontwerk", version = "1.0.0", package = "fontspector-profile-fontwerk", features = [
    "sourcefix",
] }
profile-opentype = { path = "../profile-opentype", version = "1.0.0", package = "fontspector-profile-opentype", features = [
    "sourcefix",
] }
profile-iso15008 = { path = "../profile-iso15008", version = "1.0.0", package = "fontspector-profile-iso15008", features = [
    "sourcefix",
] }
profile-googlefonts = { path = "../profile-googlefonts", version = "1.0.0", package = "fontspector-profile-googlefonts", features = [
    "sourcefix",
] }
profile-microsoft = { path = "../profile-microsoft", version = "^0.1.0", package = "fontspector-profile-microsoft", features = [
    "sourcefix",
] }
# Monotype doesn't have any source fixes yet. I mean, neither do many
# others, but it doesn't even declare the feature.
profile-monotype = { path = "../profile-monotype", version = "1.0.0", package = "fontspector-profile-monotype" }
profile-silfonts = { path = "../profile-silfonts", version = "1.0.0", package = "fontspector-profile-silfonts", features = [
    "sourcefix",
] }
clap = { version = "4", features = ["derive", "string"] }
itertools = { workspace = true }
log = { workspace = true }
env_logger = "0.11"
rayon = "1.0.1"
indicatif = { version = "0.18", features = ["rayon"] }
homedir = "0.3.4"
shadow-rs = { version = "2.0.0", default-features = false }
toml = { workspace = true }

# Terminal reporter
termimad = "0"
colored = "2.1.0"

# JSON reporter
serde = { workspace = true }
serde_json.workspace = true

# Markdown/HTML reporters
tera = { version = "1.20.0", default-features = false }
zip = { workspace = true }
# CSV reporter
csv = "1.3.1"

# DuckDB reporter
duckdb = { version = "1.2.1", features = ["bundled"], optional = true }
chrono = "0.4"

# HTML reporter
markdown = "1.0.0-alpha.23"
indexmap = { workspace = true }

fontc = { version = "1.0.0", optional = true }
glyphs2fontir = { version = "1.0.0", optional = true }
fontir = { version = "1.0.0", optional = true }
dialoguer = "0.12.0"

[lints]
workspace = true
